	eDO_SRFG_RampMode           		DO		DNET		GenNibleRampMode	-			d	 	15    5   1    0 	Poll	0     2		// RFPT Gen byte5 상위니블(bit4~7): 0=Disable,1=Watt/s,2=Timed(ms) / OnWriteDigital ID2=5 ID3=1 → 기존 byte5 하위니블 유지 + 상위니블만 변경


